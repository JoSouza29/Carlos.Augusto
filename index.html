<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Parabéns Meu Amor ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --rose:#e8a0b0;--deep-rose:#c2607a;--gold:#d4a853;--pale-gold:#f0d898;
  --bg:#080510;--text-main:#fdf0f4;--text-muted:rgba(253,240,244,0.72);
}
html{background:var(--bg);}
body{width:100%;background:var(--bg);color:var(--text-main);font-family:'Lato',sans-serif;overflow:hidden;}
body.carta-mode{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}

#particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}

.container{width:100%;height:100vh;position:relative;z-index:1;overflow:hidden;}
body.carta-mode .container{display:none;}

.screen{
  position:absolute;top:0;left:0;width:100%;height:100%;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:40px 30px;text-align:center;
  opacity:0;transform:translateX(100%);
  transition:opacity 1.8s cubic-bezier(0.4,0,0.2,1),transform 1.8s cubic-bezier(0.4,0,0.2,1);
  pointer-events:none;overflow:hidden;
}
.screen.active{opacity:1;transform:translateX(0);pointer-events:auto;}
.screen.exit{opacity:0;transform:translateX(-100%);}
.screen.caneta{justify-content:center;overflow:hidden;}

/* carta fora do container */
#carta-page{
  display:none;position:relative;z-index:1;
  min-height:100vh;padding:60px 20px 130px;
  flex-direction:column;align-items:center;
}
body.carta-mode #carta-page{display:flex;}

.title-deco{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.title-deco-line{width:40px;height:1px;background:linear-gradient(to right,transparent,var(--gold));}
.title-deco-line.right{background:linear-gradient(to left,transparent,var(--gold));}
.title-deco-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);}

.title{font-family:'Playfair Display',serif;font-size:clamp(1.5rem,3.5vw,2.6rem);font-weight:400;color:var(--text-main);letter-spacing:0.02em;line-height:1.35;margin-bottom:14px;}
.subtitle{font-family:'Lato',sans-serif;font-size:clamp(1rem,2vw,1.35rem);font-weight:300;color:var(--text-muted);max-width:760px;line-height:1.85;letter-spacing:0.01em;}

.sep{display:flex;align-items:center;gap:10px;margin:12px 0;}
.sep-line{width:30px;height:1px;background:rgba(212,168,83,0.35);}
.sep-heart{color:var(--rose);font-size:0.85rem;}

.arrow{
  margin-top:50px;width:58px;height:58px;border:1px solid rgba(232,160,176,0.55);
  border-radius:50%;display:flex;justify-content:center;align-items:center;cursor:pointer;
  transition:all 0.5s ease;animation:float 2.5s ease-in-out infinite;
  background:rgba(232,160,176,0.06);backdrop-filter:blur(4px);flex-shrink:0;
}
.arrow svg{width:20px;height:20px;stroke:var(--rose);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;transform:rotate(90deg);transition:stroke 0.3s;}
.arrow:hover{background:rgba(232,160,176,0.2);border-color:var(--rose);box-shadow:0 0 24px rgba(232,160,176,0.18);transform:scale(1.08);animation:none;}
.arrow:hover svg{stroke:var(--text-main);}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}

.cursor{display:inline-block;width:1.5px;height:1em;background:var(--rose);margin-left:2px;vertical-align:text-bottom;animation:blink 0.9s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

.screen-num{position:fixed;bottom:30px;right:36px;font-size:0.68rem;letter-spacing:3px;color:rgba(212,168,83,0.3);font-family:'Lato',sans-serif;z-index:10;pointer-events:none;}

.scroll-hint{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  opacity:0;transition:opacity 0.8s ease;pointer-events:none;z-index:10;
}
.scroll-hint.visible{opacity:1;}
.scroll-hint span{font-size:0.65rem;letter-spacing:3px;color:rgba(232,160,176,0.5);font-family:'Lato',sans-serif;text-transform:uppercase;}
.scroll-hint-arrow{
  width:22px;height:22px;
  border-right:1px solid rgba(232,160,176,0.45);
  border-bottom:1px solid rgba(232,160,176,0.45);
  transform:rotate(45deg);animation:scrollBounce 1.6s ease-in-out infinite;
}
@keyframes scrollBounce{0%,100%{transform:rotate(45deg) translateY(0);}50%{transform:rotate(45deg) translateY(6px);}}

.letter-container{width:100%;max-width:820px;margin:auto;}
.letter-card{background:rgba(255,255,255,0.034);border:1px solid rgba(232,160,176,0.18);border-radius:16px;padding:52px 52px;position:relative;backdrop-filter:blur(8px);}
.letter-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(to right,transparent,rgba(212,168,83,0.6),transparent);}
.letter{white-space:pre-line;text-align:left;line-height:2.05;font-size:clamp(0.95rem,1.8vw,1.15rem);font-weight:300;color:var(--text-muted);font-family:'Lato',sans-serif;}
.letter-footer{margin-top:44px;display:flex;flex-direction:column;align-items:center;gap:14px;}
.footer-line{width:60px;height:1px;background:linear-gradient(to right,transparent,rgba(212,168,83,0.5),transparent);}
.footer-heart{font-size:1.5rem;animation:heartbeat 2s ease-in-out infinite;}
@keyframes heartbeat{0%,100%{transform:scale(1);}14%{transform:scale(1.15);}28%{transform:scale(1);}42%{transform:scale(1.08);}56%{transform:scale(1);}}

.pen-content{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:clamp(32px,6vw,80px);flex-wrap:wrap;}
.pen-svg-wrap{animation:penFloat 3.5s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(232,160,176,0.25));}
@keyframes penFloat{0%,100%{transform:translateY(0) rotate(-15deg);}50%{transform:translateY(-16px) rotate(-15deg);}}
.ink-phrase{
  font-family:'Playfair Display',serif;font-size:clamp(1.2rem,3vw,2.1rem);
  font-weight:400;font-style:italic;color:var(--text-main);
  letter-spacing:0.03em;line-height:1.55;text-align:left;max-width:360px;
  opacity:0;transform:translateY(14px);transition:opacity 2s ease 1.2s,transform 2s ease 1.2s;
}
.screen.active .ink-phrase{opacity:1;transform:translateY(0);}
@keyframes drip{0%,100%{transform:scaleY(0.3) translateY(-4px);opacity:0.2;}50%{transform:scaleY(1) translateY(0);opacity:0.9;}}
.ink-drip{animation:drip 2.4s ease-in-out infinite;transform-origin:top center;}
@keyframes writeLine{0%{stroke-dashoffset:130;}100%{stroke-dashoffset:0;}}
.write-line{stroke-dasharray:130;stroke-dashoffset:130;animation:writeLine 2s ease-in-out infinite alternate;}

@media(max-width:600px){
  .letter-card{padding:32px 20px;}
  .pen-content{flex-direction:column;gap:28px;}
  .ink-phrase{text-align:center;}
}
</style>
</head>
<body>

<canvas id="particles"></canvas>
<div class="screen-num" id="pageNum">01 / 07</div>
<div class="scroll-hint" id="scrollHint">
  <span>rolar</span>
  <div class="scroll-hint-arrow"></div>
</div>

<div class="container">
  <!-- 01 -->
  <section class="screen active" data-page="1">
    <div class="title-deco"><div class="title-deco-line"></div><div class="title-deco-dot"></div><div class="title-deco-line right"></div></div>
    <h1 class="title typewriter" data-text="Parabéns pela promoção, meu amor 🤍!"></h1>
    <div class="sep"><div class="sep-line"></div><span class="sep-heart">✦</span><div class="sep-line"></div></div>
    <p class="subtitle typewriter" data-text="Mas antes vamos voltar ao passado..."></p>
    <div class="arrow" onclick="nextScreen()"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
  </section>

  <!-- 02 -->
  <section class="screen" data-page="2">
    <div class="title-deco"><div class="title-deco-line"></div><div class="title-deco-dot"></div><div class="title-deco-line right"></div></div>
    <p class="subtitle typewriter" data-text="12 anos, de um sonho, uma carreira passando por vários desafios, vários obstáculos..."></p>
    <div class="arrow" onclick="nextScreen()"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
  </section>

  <!-- 03 -->
  <section class="screen" data-page="3">
    <div class="title-deco"><div class="title-deco-line"></div><div class="title-deco-dot"></div><div class="title-deco-line right"></div></div>
    <p class="subtitle typewriter" data-text="Com seu sonho de ser engenheiro eletricista há cerca de 12 anos, sempre se esforçou muito para alcançá-lo, fazendo SENAI para poder entender sobre seu sonho e como trilhar sua carreira..."></p>
    <div class="arrow" onclick="nextScreen()"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
  </section>

  <!-- 04 -->
  <section class="screen" data-page="4">
    <div class="title-deco"><div class="title-deco-line"></div><div class="title-deco-dot"></div><div class="title-deco-line right"></div></div>
    <p class="subtitle typewriter" data-text="Enquanto fazia seu curso, pediu exoneração, um emprego concursado pra entrar na Dori como estagiário de elétrica, assim podendo trilhar seus passos para chegar onde você chegou..."></p>
    <div class="arrow" onclick="nextScreen()"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
  </section>

  <!-- 05 -->
  <section class="screen" data-page="5">
    <div class="title-deco"><div class="title-deco-line"></div><div class="title-deco-dot"></div><div class="title-deco-line right"></div></div>
    <h1 class="title typewriter" style="margin-bottom:0;" data-text="E voltando aos dias de hoje..."></h1>
    <div class="sep" style="margin:10px 0;"><div class="sep-line"></div><span class="sep-heart">✦</span><div class="sep-line"></div></div>
    <p class="subtitle typewriter" data-text="Essa semana veio a notícia que você tanto sonhava e esperava!"></p>
    <div class="arrow" onclick="nextScreen()"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
  </section>

  <!-- 07 CANETA -->
  <section class="screen caneta" data-page="7">
    <div class="pen-content">
      <div class="pen-svg-wrap">
        <svg width="80" height="250" viewBox="0 0 80 250" xmlns="http://www.w3.org/2000/svg">
          <rect x="25" y="8" width="30" height="148" rx="5" fill="#1a1028" stroke="#d4a853" stroke-width="1.2"/>
          <rect x="25" y="8" width="30" height="20" rx="5" fill="#b8883a" stroke="#d4a853" stroke-width="1"/>
          <line x1="25" y1="28" x2="55" y2="28" stroke="#d4a853" stroke-width="0.8"/>
          <rect x="52" y="12" width="5" height="76" rx="2.5" fill="#c99a42" stroke="#d4a853" stroke-width="0.7"/>
          <ellipse cx="54.5" cy="90" rx="3.5" ry="3.5" fill="#c99a42" stroke="#d4a853" stroke-width="0.7"/>
          <rect x="25" y="144" width="30" height="9" rx="0" fill="#c2607a" stroke="#e8a0b0" stroke-width="0.8" opacity="0.75"/>
          <polygon points="25,153 40,205 55,153" fill="#110d1c" stroke="#d4a853" stroke-width="1" stroke-linejoin="round"/>
          <polygon points="34,197 40,224 46,197" fill="#c99a42" stroke="#d4a853" stroke-width="0.8"/>
          <polygon points="38.5,222 40,234 41.5,222" fill="#d4a853"/>
          <ellipse class="ink-drip" cx="40" cy="243" rx="2.5" ry="5" fill="#e8a0b0" opacity="0.9"/>
          <rect x="29" y="18" width="3.5" height="96" rx="1.5" fill="white" opacity="0.05"/>
          <line class="write-line" x1="-10" y1="248" x2="110" y2="248" stroke="#e8a0b0" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
        </svg>
      </div>
      <div class="ink-phrase">Espero que a tinta acabe...</div>
    </div>
  </section>
</div>

<!-- 06 CARTA — fora do container, usa scroll nativo do body/html -->
<div id="carta-page">
  <div class="letter-container">
    <div class="letter-card">
      <p class="letter" id="cartaText"></p>
      <div class="letter-footer">
        <div class="footer-line"></div>
        <span class="footer-heart">❤️</span>
      </div>
    </div>
    <div style="display:flex;justify-content:center;margin-top:44px;">
      <div class="arrow" style="margin-top:0;" onclick="nextFromCarta()"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
    </div>
  </div>
</div>

<script>
const canvas=document.getElementById('particles');
const ctx=canvas.getContext('2d');
let W,H,particles=[];
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);
const COLORS=['#e8a0b0','#d4a853','#f0d898','rgba(232,160,176,0.6)','rgba(212,168,83,0.5)'];
function makeP(){return{x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+0.3,vx:(Math.random()-0.5)*0.18,vy:-Math.random()*0.22-0.06,alpha:Math.random()*0.7+0.15,color:COLORS[Math.floor(Math.random()*COLORS.length)],tw:Math.random()*Math.PI*2,tws:0.018+Math.random()*0.025};}
(function initP(){particles=[];const N=Math.min(110,Math.floor(W*H/8000));for(let i=0;i<N;i++)particles.push(makeP());})();
(function drawP(){ctx.clearRect(0,0,W,H);particles.forEach(p=>{p.tw+=p.tws;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.color;ctx.globalAlpha=p.alpha*(0.5+0.5*Math.sin(p.tw));ctx.fill();ctx.globalAlpha=1;p.x+=p.vx;p.y+=p.vy;if(p.y<-5){p.y=H+5;p.x=Math.random()*W;}if(p.x<-5)p.x=W+5;if(p.x>W+5)p.x=-5;});requestAnimationFrame(drawP);})();

const screens=Array.from(document.querySelectorAll('.container .screen'));
const pageNum=document.getElementById('pageNum');
const scrollHint=document.getElementById('scrollHint');
const TOTAL=7;
let current=0;
let onCarta=false;

function updateNum(n){pageNum.textContent=String(n).padStart(2,'0')+' / '+String(TOTAL).padStart(2,'0');}

function typeEffect(el,text,speed,onDone){
  el.innerHTML='';let i=0;
  const cursor=document.createElement('span');cursor.className='cursor';
  const iv=setInterval(()=>{el.innerHTML=text.substring(0,i);el.appendChild(cursor);i++;if(i>text.length){clearInterval(iv);if(onDone)onDone();}},speed);
}

function startTyping(screen){
  let delay=0;
  Array.from(screen.querySelectorAll('.typewriter')).forEach(el=>{
    const text=el.getAttribute('data-text');
    setTimeout(()=>typeEffect(el,text,70),delay);
    delay+=text.length*70*0.8+600;
  });
}

const CARTA_TEXT=`Hoje eu queria te olhar e conseguir colocar em palavras tudo o que sinto vendo você conquistar essa promoção depois de tantos anos. E sinceramente? Não é só uma promoção. É a prova de que toda a sua dedicação valeu a pena.

Eu vi de perto cada desafio.
Vi os dias difíceis, o cansaço, os obstáculos, as injustiças, as pirraças do Valério, as dúvidas e até os momentos em que parecia mais fácil desistir.
Mas você escolheu continuar. Escolheu enfrentar tudo de cabeça erguida, com coragem, responsabilidade e uma força que eu admiro todos os dias.

Poucas pessoas sabem o quanto você lutou para chegar até aqui.

Foram 12 anos construindo sua história com esforço, compromisso e caráter. E o mais bonito é que você nunca precisou passar por cima de ninguém para crescer. Você cresceu por mérito, coragem, profissionalismo, competência, resiliência e dedicação.

E eu preciso te dizer:
eu tenho um orgulho imenso de você.

Orgulho do profissional incrível que você se tornou, mas principalmente do homem que você é dentro de casa. O homem que sonha, que luta, que protege, que não desiste da família e que me inspira diariamente.

Agora, oficialmente promovido… será que eu já posso ficar em casa? 😅

Mas brincadeiras à parte…
você merece viver esse momento.
Merece comemorar.
Merece sentir orgulho de si mesmo.

E eu quero estar ao seu lado em cada nova conquista que ainda vai chegar, porque eu sei que isso é só o começo.

Parabéns, meu amor.
Você conseguiu.
E eu nunca tive tanta certeza de que o seu esforço seria recompensado.

Com amor,
sua maior admiradora. ❤️`;

function onBodyScroll(){
  const remaining=document.documentElement.scrollHeight-window.scrollY-window.innerHeight;
  scrollHint.classList.toggle('visible',remaining>150);
}

function showCarta(){
  onCarta=true;
  document.body.classList.add('carta-mode');
  window.scrollTo(0,0);
  updateNum(6);
  typeEffect(document.getElementById('cartaText'),CARTA_TEXT,28);
  setTimeout(()=>scrollHint.classList.add('visible'),2200);
  window.addEventListener('scroll',onBodyScroll,{passive:true});
}

function nextFromCarta(){
  onCarta=false;
  document.body.classList.remove('carta-mode');
  window.removeEventListener('scroll',onBodyScroll);
  scrollHint.classList.remove('visible');
  window.scrollTo(0,0);
  const caneta=screens[screens.length-1];
  caneta.classList.add('active');
  updateNum(7);
}

function nextScreen(){
  if(onCarta)return;
  if(current===4){
    const old=screens[current];
    old.classList.remove('active');old.classList.add('exit');
    setTimeout(()=>old.classList.remove('exit'),1300);
    setTimeout(showCarta,400);
    return;
  }
  if(current>=screens.length-1)return;
  const old=screens[current];
  old.classList.remove('active');old.classList.add('exit');
  setTimeout(()=>old.classList.remove('exit'),1300);
  current++;
  screens[current].classList.add('active');
  updateNum(current+1);
  startTyping(screens[current]);
}

updateNum(1);
window.onload=()=>startTyping(screens[0]);
</script>
</body>
</html>
