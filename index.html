<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Parabéns Meu Amor ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --rose: #e8a0b0;
  --deep-rose: #c2607a;
  --gold: #d4a853;
  --pale-gold: #f0d898;
  --bg: #080510;
  --text-main: #fdf0f4;
  --text-muted: rgba(253,240,244,0.72);
}

html,body{
  width:100%;background:var(--bg);
  color:var(--text-main);
  font-family:'Lato',sans-serif;
  overflow:hidden;
}
body.final-active{overflow:auto;}

#particles{
  position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:0;
}

.container{
  width:100%;min-height:100vh;position:relative;z-index:1;
}

.screen{
  position:absolute;
  width:100%;height:100vh;
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  padding:40px 30px;text-align:center;
  opacity:0;transform:translateX(100%);
  transition:opacity 1.2s cubic-bezier(0.4,0,0.2,1),
             transform 1.2s cubic-bezier(0.4,0,0.2,1);
}
.screen.active{opacity:1;transform:translateX(0);}
.screen.exit{opacity:0;transform:translateX(-100%);}

.title-deco{
  display:flex;align-items:center;gap:14px;
  margin-bottom:14px;
}
.title-deco-line{
  width:40px;height:1px;
  background:linear-gradient(to right,transparent,var(--gold));
}
.title-deco-line.right{
  background:linear-gradient(to left,transparent,var(--gold));
}
.title-deco-dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--gold);
}

.title{
  font-family:'Playfair Display',serif;
  font-size:clamp(1.5rem,3.5vw,2.6rem);
  font-weight:400;
  color:var(--text-main);
  letter-spacing:0.02em;
  line-height:1.35;
  margin-bottom:14px;
}

.subtitle{
  font-family:'Lato',sans-serif;
  font-size:clamp(1rem,2vw,1.35rem);
  font-weight:300;
  color:var(--text-muted);
  max-width:760px;
  line-height:1.85;
  letter-spacing:0.01em;
}

.sep{
  display:flex;align-items:center;gap:10px;
  margin:12px 0;
}
.sep-line{width:30px;height:1px;background:rgba(212,168,83,0.35);}
.sep-heart{color:var(--rose);font-size:0.85rem;}

.arrow{
  margin-top:50px;
  width:58px;height:58px;
  border:1px solid rgba(232,160,176,0.55);
  border-radius:50%;
  display:flex;justify-content:center;align-items:center;
  cursor:pointer;
  transition:all 0.5s ease;
  animation:float 2.5s ease-in-out infinite;
  background:rgba(232,160,176,0.06);
  backdrop-filter:blur(4px);
}
.arrow svg{
  width:20px;height:20px;
  stroke:var(--rose);stroke-width:1.5;
  fill:none;stroke-linecap:round;stroke-linejoin:round;
  transform:rotate(90deg);
  transition:stroke 0.3s;
}
.arrow:hover{
  background:rgba(232,160,176,0.2);
  border-color:var(--rose);
  box-shadow:0 0 24px rgba(232,160,176,0.18);
  transform:scale(1.08);
  animation:none;
}
.arrow:hover svg{stroke:var(--text-main);}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-9px);}
}

.cursor{
  display:inline-block;width:1.5px;height:1em;
  background:var(--rose);margin-left:2px;
  vertical-align:text-bottom;
  animation:blink 0.9s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

.final-screen{
  position:relative;height:auto;min-height:100vh;
  justify-content:flex-start;
  padding-top:70px;padding-bottom:90px;
  opacity:0;transform:translateX(100%);transition:1.2s cubic-bezier(0.4,0,0.2,1);
}
.final-screen.active{opacity:1;transform:translateX(0);}

.letter-container{
  width:100%;max-width:820px;
  padding:0 20px;
}

.letter-card{
  background:rgba(255,255,255,0.034);
  border:1px solid rgba(232,160,176,0.18);
  border-radius:16px;
  padding:52px 52px;
  position:relative;
  backdrop-filter:blur(8px);
}
.letter-card::before{
  content:'';
  position:absolute;top:0;left:0;right:0;
  height:1px;
  background:linear-gradient(to right,transparent,rgba(212,168,83,0.6),transparent);
}

.letter{
  white-space:pre-line;text-align:left;
  line-height:2.05;
  font-size:clamp(0.95rem,1.8vw,1.15rem);
  font-weight:300;
  color:var(--text-muted);
  font-family:'Lato',sans-serif;
}

.letter-footer{
  margin-top:44px;
  display:flex;flex-direction:column;align-items:center;
  gap:14px;
}
.footer-line{
  width:60px;height:1px;
  background:linear-gradient(to right,transparent,rgba(212,168,83,0.5),transparent);
}
.footer-heart{
  font-size:1.5rem;
  animation:heartbeat 2s ease-in-out infinite;
}
@keyframes heartbeat{
  0%,100%{transform:scale(1);}
  14%{transform:scale(1.15);}
  28%{transform:scale(1);}
  42%{transform:scale(1.08);}
  56%{transform:scale(1);}
}

.scroll-hint{
  display:none;margin-top:32px;
  flex-direction:column;align-items:center;gap:8px;
  opacity:0;animation:fadeHint 1s ease 2.5s forwards;
}
.final-screen.active .scroll-hint{display:flex;}
.scroll-hint span{
  font-size:0.68rem;letter-spacing:3px;
  text-transform:uppercase;
  color:rgba(232,160,176,0.4);
}
.scroll-chevron{
  width:26px;height:26px;
  border-right:1px solid rgba(232,160,176,0.35);
  border-bottom:1px solid rgba(232,160,176,0.35);
  transform:rotate(45deg);
  animation:bounce 1.6s ease-in-out infinite;
}
@keyframes bounce{
  0%,100%{transform:rotate(45deg) translate(0,0);}
  50%{transform:rotate(45deg) translate(3px,3px);}
}
@keyframes fadeHint{to{opacity:1;}}

.screen-num{
  position:absolute;bottom:30px;right:36px;
  font-size:0.68rem;letter-spacing:3px;
  color:rgba(212,168,83,0.3);
  font-family:'Lato',sans-serif;
}

@media(max-width:700px){
  .letter-card{padding:36px 24px;}
  .title{font-size:1.45rem;}
}
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="container">

  <!-- TELA 1: sem ornamento acima, title direto + sep compacto + subtitle -->
  <section class="screen active">
    <div class="title-deco">
      <div class="title-deco-line"></div>
      <div class="title-deco-dot"></div>
      <div class="title-deco-line right"></div>
    </div>
    <h1 class="title typewriter" data-text="Parabéns pela promoção, meu amor 🤍!"></h1>
    <div class="sep">
      <div class="sep-line"></div>
      <span class="sep-heart">✦</span>
      <div class="sep-line"></div>
    </div>
    <p class="subtitle typewriter" data-text="Mas antes vamos voltar ao passado..."></p>
    <div class="arrow" onclick="nextScreen()">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
    <div class="screen-num">01 / 06</div>
  </section>

  <!-- TELA 2 -->
  <section class="screen">
    <div class="title-deco">
      <div class="title-deco-line"></div>
      <div class="title-deco-dot"></div>
      <div class="title-deco-line right"></div>
    </div>
    <p class="subtitle typewriter" data-text="12 anos, de um sonho, uma carreira passando por vários desafios, vários obstáculos..."></p>
    <div class="arrow" onclick="nextScreen()">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
    <div class="screen-num">02 / 06</div>
  </section>

  <!-- TELA 3 -->
  <section class="screen">
    <div class="title-deco">
      <div class="title-deco-line"></div>
      <div class="title-deco-dot"></div>
      <div class="title-deco-line right"></div>
    </div>
    <p class="subtitle typewriter" data-text="Com seu sonho de ser engenheiro eletricista há cerca de 12 anos, sempre se esforçou muito para alcançá-lo, fazendo SENAI para poder entender sobre seu sonho e como trilhar sua carreira..."></p>
    <div class="arrow" onclick="nextScreen()">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
    <div class="screen-num">03 / 06</div>
  </section>

  <!-- TELA 4 -->
  <section class="screen">
    <div class="title-deco">
      <div class="title-deco-line"></div>
      <div class="title-deco-dot"></div>
      <div class="title-deco-line right"></div>
    </div>
    <p class="subtitle typewriter" data-text="Enquanto fazia seu curso, pediu exoneração, um emprego concursado pra entrar na Dori como estagiário de elétrica, assim podendo trilhar seus passos para chegar onde você chegou..."></p>
    <div class="arrow" onclick="nextScreen()">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
    <div class="screen-num">04 / 06</div>
  </section>

  <!-- TELA 5: title colado ao sep, sem margin-bottom extra -->
  <section class="screen">
    <div class="title-deco">
      <div class="title-deco-line"></div>
      <div class="title-deco-dot"></div>
      <div class="title-deco-line right"></div>
    </div>
    <h1 class="title typewriter" style="margin-bottom:0;" data-text="E voltando aos dias de hoje..."></h1>
    <div class="sep" style="margin:10px 0;">
      <div class="sep-line"></div>
      <span class="sep-heart">✦</span>
      <div class="sep-line"></div>
    </div>
    <p class="subtitle typewriter" data-text="Essa semana veio a notícia que você tanto sonhava e esperava!"></p>
    <div class="arrow" onclick="nextScreen()">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
    <div class="screen-num">05 / 06</div>
  </section>

  <!-- TELA 6 — CARTA FINAL: sem header/título, carta direta -->
  <section class="screen final-screen">
    <div class="letter-container">
      <div class="letter-card">
        <p class="letter typewriter"
data-text="Hoje eu queria te olhar e conseguir colocar em palavras tudo o que sinto vendo você conquistar essa promoção depois de tantos anos. E sinceramente? Não é só uma promoção. É a prova de que toda a sua dedicação valeu a pena.

Eu vi de perto cada desafio.
Vi os dias difíceis, o cansaço, os obstáculos, as injustiças, as pirraças do Valério, as dúvidas e até os momentos em que parecia mais fácil desistir. 
Mas você escolheu continuar. Escolheu enfrentar tudo de cabeça erguida, com coragem, responsabilidade e uma força que eu admiro todos os dias.

Poucas pessoas sabem o quanto você lutou para chegar até aqui.

Foram 12 anos construindo sua história com esforço, compromisso e caráter. E o mais bonito é que você nunca precisou passar por cima de ninguém para crescer. Você cresceu por mérito, coragem, profissionalismo, competência, resiliência e dedicação.

E eu preciso te dizer:
eu tenho um orgulho imenso de você.

Orgulho do profissional incrível que você se tornou, mas principalmente do homem que você é dentro de casa. O homem que sonha, que luta, que protege, que não desiste da família e que me inspira diariamente.

Agora, oficialmente promovido… será que eu já posso ficar em casa? 😅

Mas brincadeiras à parte…
você merece viver esse momento.
Merece comemorar.
Merece sentir orgulho de si mesmo.

E eu quero estar ao seu lado em cada nova conquista que ainda vai chegar, porque eu sei que isso é só o começo.

Parabéns, meu amor.
Você conseguiu.
E eu nunca tive tanta certeza de que o seu esforço seria recompensado.

Com amor,
sua maior admiradora. ❤️"></p>

        <div class="letter-footer">
          <div class="footer-line"></div>
          <span class="footer-heart">❤️</span>
        </div>
      </div>

      <div class="scroll-hint">
        <span>role para baixo</span>
        <div class="scroll-chevron"></div>
      </div>
    </div>
    <div class="screen-num">06 / 06</div>
  </section>

</div>

<script>
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let W, H, particles=[];

function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
}
resize();
window.addEventListener('resize',resize);

const COLORS=['#e8a0b0','#d4a853','#f0d898','rgba(232,160,176,0.6)','rgba(212,168,83,0.5)'];

function Particle(){
  this.x=Math.random()*W;
  this.y=Math.random()*H;
  this.r=Math.random()*1.4+0.3;
  this.vx=(Math.random()-0.5)*0.18;
  this.vy=-Math.random()*0.22-0.06;
  this.alpha=Math.random()*0.7+0.15;
  this.color=COLORS[Math.floor(Math.random()*COLORS.length)];
  this.twinkle=Math.random()*Math.PI*2;
  this.twinkleSpeed=0.018+Math.random()*0.025;
}

function initParticles(){
  particles=[];
  const N=Math.min(110,Math.floor(W*H/8000));
  for(let i=0;i<N;i++) particles.push(new Particle());
}
initParticles();

function drawParticles(){
  ctx.clearRect(0,0,W,H);
  particles.forEach(p=>{
    p.twinkle+=p.twinkleSpeed;
    const a=p.alpha*(0.5+0.5*Math.sin(p.twinkle));
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.color;
    ctx.globalAlpha=a;
    ctx.fill();
    ctx.globalAlpha=1;
    p.x+=p.vx;p.y+=p.vy;
    if(p.y<-5){p.y=H+5;p.x=Math.random()*W;}
    if(p.x<-5)p.x=W+5;
    if(p.x>W+5)p.x=-5;
  });
  requestAnimationFrame(drawParticles);
}
drawParticles();

const screens=document.querySelectorAll('.screen');
let current=0;

function typeEffect(el,text,speed,onDone){
  el.innerHTML='';
  let i=0;
  const cursor=document.createElement('span');
  cursor.className='cursor';
  const iv=setInterval(()=>{
    el.innerHTML=text.substring(0,i);
    el.appendChild(cursor);
    i++;
    if(i>text.length){clearInterval(iv);if(onDone)onDone();}
  },speed);
}

function startTyping(screen){
  const els=[...screen.querySelectorAll('.typewriter')];
  let delay=0;
  els.forEach(el=>{
    const text=el.getAttribute('data-text');
    const isFinal=screen.classList.contains('final-screen');
    const speed=isFinal?18:45;
    setTimeout(()=>typeEffect(el,text,speed),delay);
    delay+=text.length*(speed*0.8)+600;
  });
}

function nextScreen(){
  if(current>=screens.length-1)return;
  const old=screens[current];
  old.classList.remove('active');
  old.classList.add('exit');
  setTimeout(()=>old.classList.remove('exit'),1300);
  current++;
  const next=screens[current];
  next.classList.add('active');
  if(next.classList.contains('final-screen')){
    document.body.classList.add('final-active');
    window.scrollTo({top:0});
  }
  startTyping(next);
}

window.onload=()=>startTyping(screens[0]);
</script>
</body>
</html>
