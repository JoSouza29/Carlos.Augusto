<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Parabéns Meu Amor ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#000;
    color:white;
    font-family:'Montserrat', sans-serif;
}

.container{
    width:100%;
    height:100vh;
    position:relative;
}

.screen{
    position:absolute;
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:30px;
    text-align:center;
    background:linear-gradient(180deg,#000,#0d0d0d,#000);
    opacity:0;
    transform:translateX(100%);
    transition:1s ease;
}

.screen.active{
    opacity:1;
    transform:translateX(0);
}

.title{
    font-family:'Pacifico', cursive;
    font-size:clamp(1.6rem,4vw,3rem);
    margin-bottom:20px;
    white-space:nowrap;
    overflow:hidden;
}

.subtitle{
    font-family:'Montserrat', sans-serif;
    font-size:clamp(1rem,2.3vw,1.5rem);
    max-width:1000px;
    line-height:1.7;
    font-weight:300;
}

.arrow{
    margin-top:60px;
    width:65px;
    height:65px;
    border:2px solid white;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    transition:0.4s;
    animation:float 2s infinite;
}

.arrow span{
    font-size:2rem;
    transform:rotate(90deg);
}

.arrow:hover{
    background:white;
    color:black;
    transform:scale(1.1);
}

@keyframes float{
    0%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
    100%{
        transform:translateY(0);
    }
}

.cursor{
    display:inline-block;
    width:2px;
    background:white;
    margin-left:3px;
    animation:blink 0.8s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

@media(max-width:768px){

    .title{
        white-space:normal;
        line-height:1.4;
    }

    .subtitle{
        font-size:1rem;
    }

    .arrow{
        width:55px;
        height:55px;
    }

    .arrow span{
        font-size:1.7rem;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- TELA 1 -->
    <section class="screen active">
        <h1 class="title typewriter"
            data-text="Parabéns pela promoção, meu amor">
        </h1>

        <p class="subtitle typewriter"
           data-text="Mas antes vamos voltar ao passado...">
        </p>

        <div class="arrow" onclick="nextScreen()">
            <span>></span>
        </div>
    </section>

    <!-- TELA 2 -->
    <section class="screen">
        <p class="subtitle typewriter"
           data-text="12 anos, de um sonho, uma carreira passando por vários desafios, vários obstáculos...">
        </p>

        <div class="arrow" onclick="nextScreen()">
            <span>></span>
        </div>
    </section>

    <!-- TELA 3 -->
    <section class="screen">
        <p class="subtitle typewriter"
           data-text="Com seu sonho de ser engenheiro elétrico há cerca de 12 anos, sempre se esforçou muito para alcançá-lo, fazendo SENAI para poder entender sobre seu sonho e como trilhar sua carreira...">
        </p>

        <div class="arrow" onclick="nextScreen()">
            <span>></span>
        </div>
    </section>

    <!-- TELA 4 -->
    <section class="screen">
        <p class="subtitle typewriter"
           data-text="Enquanto fazia seu curso, pediu exoneração, um emprego concursado pra entrar na Dori como estagiário de elétrica, assim podendo trilhar seus passos para chegar onde você chegou...">
        </p>

        <div class="arrow" onclick="nextScreen()">
            <span>></span>
        </div>
    </section>

    <!-- TELA 5 -->
    <section class="screen">
        <h1 class="title typewriter"
            data-text="E voltando aos dias de hoje...">
        </h1>

        <p class="subtitle typewriter"
           data-text="E essa semana veio a grande notícia, uma promoção pra engenheiro eletricista...">
        </p>

        <div class="arrow">
            <span>></span>
        </div>
    </section>

</div>

<script>
const screens = document.querySelectorAll('.screen');
let currentScreen = 0;

function typeEffect(element, text, speed = 45){
    element.innerHTML = "";

    let i = 0;

    const cursor = document.createElement('span');
    cursor.classList.add('cursor');

    const typing = setInterval(() => {

        element.innerHTML = text.substring(0, i);

        element.appendChild(cursor);

        i++;

        if(i > text.length){
            clearInterval(typing);
        }

    }, speed);
}

function startTyping(screen){

    const elements = screen.querySelectorAll('.typewriter');

    let delay = 0;

    elements.forEach((el) => {

        const text = el.getAttribute('data-text');

        setTimeout(() => {
            typeEffect(el, text);
        }, delay);

        delay += text.length * 45 + 800;
    });
}

function nextScreen(){

    if(currentScreen < screens.length - 1){

        screens[currentScreen].classList.remove('active');

        currentScreen++;

        screens[currentScreen].classList.add('active');

        startTyping(screens[currentScreen]);
    }
}

window.onload = () => {
    startTyping(screens[0]);
};
</script>

</body>
</html>
